  title: Earthquake
  hazard: Geophysical
  description: 'Earthquake exposure is derived from the GEM Global Seismic Hazard Map (v2023.1, June 2023), which maps peak
    ground acceleration (PGA) on reference rock for a 10% probability of exceedance in 50 years (475-year return period; Vs30
    = 760–800 m/s). Exposed children and population are identified using two thresholds linked to Mercalli intensities: Strong
    shaking (VI; PGA ≥ 0.09 g) and Severe shaking (VIII; PGA ≥ 0.34 g). Outputs include absolute and relative exposure and
    normalized scores (0–10).'
