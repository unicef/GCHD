- id: river_flood_100yr_jrc_2024
  collection: flood
  source_filename: river_flood_100yr_jrc_2024_1km.tif
  title: Riverine flood hazard
  hazard: Floods
  description: A fluvial or riverine flood is a rise, usually brief, in the water level of a stream or water body to a peak
    from which the water level recedes at a slower rate.
  notes: JRC currently has 90m and plans to release 30 m in the coming years which could be useful for sub-national and localized
    analysis in the future - also includes SSP based projections. CCRI 2021 used GAR 2015 which is quite outdated. GRID 2023
    has some inconsistencies (comment from CCRI-DRM team). WRI is also a good alternative with projections - but yet to identify
    the future update frequencies and resolutions; it might also be good to align with INFORM data sources. Highest return
    period chosen to capture the maximum exposure.
  hazard_phase: Preparedness/Planning
  data_type: Probabilistic - 100 year return period
  resolution: 90m
  coverage: Global
  units: Depth in m
  legend_label: Depth in m
  threshold: '0.01'
  classes: 0.01 - 0.15 - 0.5 - 1.5 - 2+
  range:
  - 0.0
  - 50.0
  actual_range:
  - 0.144
  - 43.56
  nodata_note: nan
  source_provider: JRC
  alternate_sources: WRI, UNEP GRID 2023
  gee_asset: projects/unicef-ccri/assets/hazrards/river_flood_r100
  naming_convention: river_flood_100yr_jrc_2024
