- id: landslides_trig_earthquakes
  collection: landslide
  source_filename: landslides_trig_earthquakes.tif
  title: Landslide (earthquake induced)
  hazard: Geophysical
  description: 'The Global Landslide Hazard Map: Earthquake-Triggered Landslide Hazard presents an estimate of earthquake-triggered
    landslide hazard at a global scale which builds upon work by Nadim et al. (2006; 2013) and uses the NASA Global Landslide
    Susceptibility Map as a base.'
  notes: Nadim et al. (2006; 2013) and Arup-BGS (2018) generate a landslide susceptibility score by scoring, ranking and multiplying
    a series of susceptibility factors. An earthquake-triggered landslide hazard score is then generated by multiplying this
    susceptibility score by a triggering factor. For this project, the susceptibility score is provided by the NASA Global
    Landslide Susceptibility Map – the score being a number between 1 and 5 representing very low through to very high landslide
    susceptibility. The earthquake-triggered landslide hazard score is generated by multiplying this NASA Global Landslide
    Susceptibility Map score by the seismic-trigger index proposed by Nadim et al. (2005; 2013) . The resulting score is then
    scaled to the range 0 – 300 to allow comparison with the estimation of earthquake-triggered landslide hazard and the corresponding
    approximate annual frequency proposed by Nadim et al. (2006; 2013).
  hazard_phase: Preparedness/Planning
  data_type: Modelled
  resolution: ~100m
