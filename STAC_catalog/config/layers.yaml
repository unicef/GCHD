  hazard: Vector Borne Diseases
  description: P. vivax is the dominant malaria parasite in most countries outside of sub-Saharan Africa. Malaria is a life-threatening
    disease caused by parasites transmitted to humans through the bites of infected female Anopheles mosquitoes.
  notes: This layer map provides estimates of newly diagnosed Plasmodium falciparum cases per 1,000 population, on a given
    year. To produce these estimates, we apply geostatistical models to response datasets consisting of PR points and routine
    surveillance reports, and a rich set of geospatial covariates that characterise habitat for Anopheles mosquitos that spread
    the disease. The maps cover all malaria-endemic countries and are produced annually from year 2000 at a 5x5 km resolution.
    The rasters may be downloaded as a series of multi-band GeoTiffs. The first band consists of the modelled estimates as
    rates per person [0-1]. The second band is a mask consisting of the values zero and 1; the 1 values represent pixels that
    we mask out because they are sparsely populated. This masking is only applied to South America, and we define "sparsely
    populated" as areas that have a modelled estimate of >0 and a population of ≤5 people per pixel.
