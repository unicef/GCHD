- id: drought_spei_terraclimate_1958-2025
  collection: drought
  source_filename: SPEI12_return_level_100yr.tif
  title: Meteorological Drought (Standardized Precipitation Evapotranspiration Index)
  hazard: Droughts
  description: SPEI adds the effect of evapotranspiration and is better suited to assess droughts under climate change scenarios
    where temperature changes are important. Probability values are computed from the full 1958–2025 record (804 monthly time
    steps) dividing the numbers of months lower than TH (1.5) with total months
  notes: 'The SPEI is an extension of the SPI and incorporates potential evapotranspiration to capture the impact of temperature
    on drought -12-month time scale. More details: https://github.com/dohyung-kim/precip-index/blob/main/README.md'
  hazard_phase: Preparedness/Planning
