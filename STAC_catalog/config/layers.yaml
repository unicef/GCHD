- id: drought_spi_terraclimate_1958-2025
  collection: drought
  source_filename: drought_spi_copernicus_1940_2024.tif
  title: Meteorological Drought (Standardized Precipitation Index)
  hazard: Droughts
  description: SPI measures the deviation of precipitation from the climatological average over a given accumulation period
    and is widely used to detect and characterize meteorological droughts. Probability values are computed from the full 1958–2025
    record (804 monthly time steps) dividing the numbers of months lower than TH (1.5) with total months
  notes: 'The SPI measures the precipitation deficit that accumulated over the preceding months and evaluates the deficit
    with respect to a reference period -12-month time scale. More details: https://github.com/dohyung-kim/precip-index/blob/main/README.md'
  hazard_phase: Preparedness/Planning
  data_type: Probabilistic - empirical
  resolution: 5km
